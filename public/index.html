<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WordMaster — 1,000 most frequent English words</title>
<style>
  :root {
    --ink: #1e293b;
    --muted: #475569;
    --violet: #7c3aed;
    --violet-deep: #6d28d9;
    --pink: #db2777;
    --amber: #d97706;
    --teal: #0d9488;
    --sky: #0284c7;
    --green: #15803d;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: linear-gradient(165deg, #fffbeb 0%, #fdf2f8 32%, #eef2ff 64%, #ecfeff 100%);
    background-attachment: fixed;
    color: var(--ink);
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }

  /* ---- Hero header: one joyful gradient banner ---- */
  header {
    background: linear-gradient(115deg, #6d28d9 0%, #a21caf 45%, #db2777 72%, #f59e0b 115%);
    border-radius: 20px;
    padding: 24px 26px 20px;
    color: #fff;
    box-shadow: 0 12px 30px rgba(124, 58, 237, .35);
    margin-top: 6px;
  }
  header h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: .5px; color: #fff; }
  header p { margin: 0; color: rgba(255, 255, 255, .92); }

  /* ---- Nav: pill tabs, one accent colour per view ---- */
  nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
  button {
    padding: 10px 16px; font-size: 16px; font-weight: 600;
    border: 2px solid #e2e8f0; border-radius: 999px;
    background: rgba(255, 255, 255, .9); color: #334155;
    cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease, background .12s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(30, 41, 59, .12); }
  button:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
  nav button.active { color: #fff; border-color: transparent; }
  nav button.nav-home.active { background: linear-gradient(120deg, #7c3aed, #a855f7); box-shadow: 0 6px 16px rgba(124, 58, 237, .4); }
  nav button.nav-sentence.active { background: linear-gradient(120deg, #f59e0b, #f97316); box-shadow: 0 6px 16px rgba(249, 115, 22, .4); }
  nav button.nav-stats.active { background: linear-gradient(120deg, #0d9488, #059669); box-shadow: 0 6px 16px rgba(13, 148, 136, .4); }
  nav button.nav-home:hover:not(.active) { border-color: #a78bfa; color: var(--violet-deep); }
  nav button.nav-sentence:hover:not(.active) { border-color: #fbbf24; color: #b45309; }
  nav button.nav-stats:hover:not(.active) { border-color: #2dd4bf; color: #0f766e; }

  /* ---- Primary / accent buttons ---- */
  .btn-primary {
    background: linear-gradient(120deg, #7c3aed, #db2777);
    color: #fff; border: none;
    box-shadow: 0 8px 20px rgba(219, 39, 119, .35);
  }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-amber {
    background: linear-gradient(120deg, #f59e0b, #f97316);
    color: #fff; border: none;
    box-shadow: 0 8px 20px rgba(249, 115, 22, .35);
  }
  .btn-amber:hover { filter: brightness(1.06); }

  /* ---- Cards: soft white, coloured top accent per view ---- */
  .card {
    background: rgba(255, 255, 255, .93);
    border: 1px solid #e2e8f0; border-radius: 16px;
    padding: 20px; margin: 16px 0;
    box-shadow: 0 6px 20px rgba(30, 41, 59, .07);
  }
  .view-home .card { border-top: 4px solid #8b5cf6; }
  .view-sentence .card { border-top: 4px solid #f59e0b; }
  .view-stats .card { border-top: 4px solid #14b8a6; }
  .view-quiz .card { border-top: 4px solid #ec4899; }
  .card h2 { margin-top: 0; }
  .view-home .card h2 { color: var(--violet-deep); }
  .view-sentence .card h2 { color: #b45309; }
  .view-stats .card h2 { color: #0f766e; }
  .view-quiz .card h2 { color: #be185d; }
  .card-note { background: linear-gradient(160deg, #eff6ff, #f0fdfa); border-color: #bae6fd; }

  /* ---- Quiz ---- */
  .word-prompt {
    font-size: 44px; font-weight: 800; text-align: center; margin: 8px 0 20px;
    background: linear-gradient(90deg, #7c3aed, #db2777 55%, #ea580c);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--violet-deep);
  }
  .options { display: grid; gap: 10px; }
  .option { text-align: left; padding: 14px 16px; font-size: 17px; border-radius: 12px; border-width: 2px; }
  .option:hover:not(:disabled) { border-color: #a78bfa; box-shadow: 0 4px 14px rgba(124, 58, 237, .18); }
  .opt-0 { background: #eff6ff; border-color: #bfdbfe; }
  .opt-1 { background: #fdf2f8; border-color: #fbcfe8; }
  .opt-2 { background: #fffbeb; border-color: #fde68a; }
  .opt-3 { background: #ecfdf5; border-color: #a7f3d0; }
  .option.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; font-weight: 700; box-shadow: 0 0 0 3px rgba(22, 163, 74, .18); }
  .option.wrong { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; font-weight: 700; box-shadow: 0 0 0 3px rgba(220, 38, 38, .15); }
  .progress { height: 12px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin: 8px 0; box-shadow: inset 0 1px 3px rgba(30, 41, 59, .15); }
  .progress > div {
    height: 100%; border-radius: 999px;
    background: linear-gradient(90deg, #8b5cf6, #ec4899 55%, #f59e0b);
    box-shadow: 0 0 8px rgba(236, 72, 153, .5);
    transition: width .3s ease;
  }
  .feedback { font-weight: 700; padding: 10px 14px; border-radius: 10px; }
  .feedback-correct { background: #dcfce7; color: #166534; }
  .feedback-wrong { background: #fee2e2; color: #991b1b; }

  /* ---- Badges & highlights ---- */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid transparent; }
  .badge-new { background: #e0f2fe; color: #075985; border-color: #bae6fd; }
  .badge-mastered { background: #dcfce7; color: #166534; border-color: #bbf7d0; }
  .hl { background: #fef3c7; color: #92400e; padding: 0 4px; border-radius: 4px; font-weight: 700; }
  .hl-0 { background: #fde68a; color: #92400e; }
  .hl-1 { background: #fbcfe8; color: #9d174d; }
  .hl-2 { background: #bfdbfe; color: #1e40af; }
  .hl-3 { background: #a7f3d0; color: #065f46; }
  .sentence-text {
    background: linear-gradient(160deg, #fffbeb, #fdf2f8);
    border: 1px solid #fde68a; border-radius: 12px; padding: 16px 18px;
  }
  .sentence-count {
    display: inline-block; margin: 12px 0 0; padding: 6px 14px;
    background: linear-gradient(120deg, #fef3c7, #ffedd5);
    border: 1px solid #fcd34d; border-radius: 999px;
    color: #92400e; font-weight: 700; font-size: 15px;
  }
  .muted { color: var(--muted); }

  /* ---- Stats: one soft tint per card, strong coloured number ---- */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; box-shadow: 0 4px 14px rgba(30, 41, 59, .06); }
  .stat b { font-size: 32px; display: block; }
  .stat-mastered { background: linear-gradient(160deg, #ecfdf5, #d1fae5); border-color: #6ee7b7; }
  .stat-mastered b { color: #047857; }
  .stat-new { background: linear-gradient(160deg, #eff6ff, #dbeafe); border-color: #93c5fd; }
  .stat-new b { color: #1d4ed8; }
  .stat-due { background: linear-gradient(160deg, #fffbeb, #fef3c7); border-color: #fcd34d; }
  .stat-due b { color: #b45309; }
  .stat-total { background: linear-gradient(160deg, #f5f3ff, #ede9fe); border-color: #c4b5fd; }
  .stat-total b { color: #6d28d9; }

  table { border-collapse: collapse; width: 100%; }
  th { background: #ede9fe; color: #5b21b6; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; }
  tbody tr:nth-child(even) { background: #f8fafc; }

  @media (max-width: 600px) {
    .wrap { padding: 12px; }
    header { padding: 18px; border-radius: 16px; }
    header h1 { font-size: 28px; }
    .word-prompt { font-size: 34px; }
    .card { padding: 16px; }
    .stat b { font-size: 26px; }
  }
</style>
</head>
<body>
<div id="app"><p style="padding:24px">Loading WordMaster…</p></div>
<script src="js/main.js"></script>
</body>
</html>
